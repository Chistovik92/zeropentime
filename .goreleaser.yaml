# Сборка релизов: goreleaser release --clean --release-notes notes.md
# Проверка локально: goreleaser release --snapshot --clean
version: 2
project_name: zeropentime

before:
  hooks:
    - go mod tidy -diff
    - bash scripts/fetch-wintun.sh

builds:
  # Узел собирается раздельно по ОС: в архив для Windows кладётся wintun.dll.
  - id: zpt-linux
    main: ./cmd/zpt
    binary: zpt
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: zpt-windows
    main: ./cmd/zpt
    binary: zpt
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Трей: Windows (без окна консоли) и Linux (StatusNotifierItem через DBus).
  - id: zpt-tray-linux
    main: ./cmd/zpt-tray
    binary: zpt-tray
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: zpt-tray-windows
    main: ./cmd/zpt-tray
    binary: zpt-tray
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -H windowsgui -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: zpt-controller
    main: ./cmd/zpt-controller
    binary: zpt-controller
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Узел: MPL-2.0.
  - id: zpt-linux
    ids: [zpt-linux, zpt-tray-linux]
    name_template: "zpt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - LICENSING.md
      - TRADEMARKS.md
      - README.md
      - CHANGELOG.md
      - deploy/examples/zpt.yaml

  - id: zpt-windows
    ids: [zpt-windows, zpt-tray-windows]
    name_template: "zpt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files:
      - LICENSE
      - LICENSING.md
      - TRADEMARKS.md
      - README.md
      - CHANGELOG.md
      - deploy/examples/zpt.yaml
      - src: "third_party/wintun/bin/{{ .Arch }}/wintun.dll"
        dst: wintun.dll
      - src: third_party/wintun/LICENSE.txt
        dst: wintun-LICENSE.txt

  # Контроллер: AGPL-3.0.
  - id: zpt-controller
    ids: [zpt-controller]
    name_template: "zpt-controller_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE.AGPL
      - LICENSING.md
      - TRADEMARKS.md
      - README.md
      - CHANGELOG.md

# Пакеты узла для Linux: служба systemd (включается при установке),
# конфиг /etc/zeropentime/zpt.yaml, обработчик ссылок zpt://.
nfpms:
  - id: zpt
    ids: [zpt-linux, zpt-tray-linux]
    package_name: zeropentime
    file_name_template: "zeropentime_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: zeropentime
    homepage: https://github.com/Chistovik92/zeropentime
    maintainer: Chistovik92 <Chistovik92@yandex.ru>
    description: |-
      Узел zeropentime: виртуальные LAN-комнаты на AmneziaWG.
      Вступление по ссылке-приглашению: zpt join "zpt://…" или клик по ссылке.
    license: MPL-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    section: net
    contents:
      - src: deploy/packaging/linux/zpt.service
        dst: /usr/lib/systemd/system/zpt.service
      - src: deploy/packaging/linux/zpt-open.desktop
        dst: /usr/share/applications/zpt-open.desktop
      - src: deploy/packaging/linux/zpt-tray.desktop
        dst: /usr/share/applications/zpt-tray.desktop
      - src: deploy/packaging/linux/zpt-tray.desktop
        dst: /etc/xdg/autostart/zpt-tray.desktop
      - src: deploy/packaging/zpt.yaml
        dst: /etc/zeropentime/zpt.yaml
        type: config|noreplace
        file_info:
          mode: 0600
      - dst: /etc/zeropentime
        type: dir
        file_info:
          mode: 0700
      - src: LICENSE
        dst: /usr/share/doc/zeropentime/LICENSE
      - src: LICENSING.md
        dst: /usr/share/doc/zeropentime/LICENSING.md
    scripts:
      postinstall: deploy/packaging/linux/postinstall.sh
      preremove: deploy/packaging/linux/preremove.sh
      postremove: deploy/packaging/linux/postremove.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Заметки к релизу берутся из CHANGELOG.md (scripts/release-notes.sh,
# флаг --release-notes); свой журнал goreleaser не собирает. Выключать
# changelog нельзя: тогда пустым остаётся и текст релиза.

release:
  github:
    owner: Chistovik92
    name: zeropentime
  # Релиз создаётся черновиком и публикуется после проверки архивов.
  draft: true
  prerelease: auto
  name_template: "zeropentime {{ .Version }}"
