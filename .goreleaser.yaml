# Сборка релизов: goreleaser release --clean --release-notes notes.md
# Проверка локально: goreleaser release --snapshot --clean
version: 2
project_name: zeropentime

before:
  hooks:
    - go mod tidy -diff
    - bash scripts/fetch-wintun.sh

builds:
  # Узел собирается раздельно по ОС: в архив для Windows кладётся wintun.dll.
  - id: zpt-linux
    main: ./cmd/zpt
    binary: zpt
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: zpt-windows
    main: ./cmd/zpt
    binary: zpt
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: zpt-controller
    main: ./cmd/zpt-controller
    binary: zpt-controller
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Узел: MPL-2.0.
  - id: zpt-linux
    ids: [zpt-linux]
    name_template: "zpt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - LICENSING.md
      - TRADEMARKS.md
      - README.md
      - CHANGELOG.md
      - deploy/examples/zpt.yaml

  - id: zpt-windows
    ids: [zpt-windows]
    name_template: "zpt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files:
      - LICENSE
      - LICENSING.md
      - TRADEMARKS.md
      - README.md
      - CHANGELOG.md
      - deploy/examples/zpt.yaml
      - src: "third_party/wintun/bin/{{ .Arch }}/wintun.dll"
        dst: wintun.dll
      - src: third_party/wintun/LICENSE.txt
        dst: wintun-LICENSE.txt

  # Контроллер: AGPL-3.0.
  - id: zpt-controller
    ids: [zpt-controller]
    name_template: "zpt-controller_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE.AGPL
      - LICENSING.md
      - TRADEMARKS.md
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Заметки к релизу берутся из CHANGELOG.md (scripts/release-notes.sh).
changelog:
  disable: true

release:
  github:
    owner: Chistovik92
    name: zeropentime
  # Релиз создаётся черновиком и публикуется после проверки архивов.
  draft: true
  prerelease: auto
  name_template: "zeropentime {{ .Version }}"
