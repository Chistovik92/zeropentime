<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · zeropentime</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
{{if .User}}
<header class="top">
  <a class="brand" href="/rooms">zeropentime</a>
  <nav>
    <a href="/rooms">Комнаты</a>
    {{if .User.IsAdmin}}<a href="/users">Пользователи</a><a href="/audit">Журнал</a>{{end}}
    <a href="/account">{{.User.Login}}</a>
    <form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link">Выйти</button></form>
  </nav>
</header>
{{end}}
<main>
  {{if .OK}}<div class="flash ok">{{.OK}}</div>{{end}}
  {{if .Err}}<div class="flash err">{{.Err}}</div>{{end}}
  {{template "content" .}}
</main>
</body>
</html>
