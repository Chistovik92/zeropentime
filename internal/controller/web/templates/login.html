{{define "content"}}
<section class="card narrow">
  <h1>zeropentime</h1>
  <p class="muted">Вход в панель управления</p>
  <form method="post" action="/login" class="stack">
    <label>Логин <input name="login" autocomplete="username" required autofocus></label>
    <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
    <label>Код 2FA <span class="muted">(если включён)</span> <input name="code" inputmode="numeric" autocomplete="one-time-code"></label>
    <button>Войти</button>
  </form>
  {{if .Data}}<p class="center"><a class="button" href="/login/oidc">Войти через {{.Data}}</a></p>{{end}}
</section>
{{end}}
