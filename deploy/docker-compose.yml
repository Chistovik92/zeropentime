# Контроллер за обратным прокси Caddy с автоматическим HTTPS.
# 1. Укажите свой домен в ZPT_DOMAIN (DNS должен указывать на этот сервер).
# 2. docker compose up -d
# 3. docker compose exec controller zpt-controller useradd -db /data/controller.db -login admin -admin
services:
  controller:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["serve", "-db", "/data/controller.db", "-listen", ":8080", "-url", "https://${ZPT_DOMAIN}", "-trust-proxy"]
    volumes:
      - zpt-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    command: caddy reverse-proxy --from ${ZPT_DOMAIN} --to controller:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    restart: unless-stopped

volumes:
  zpt-data:
  caddy-data:
