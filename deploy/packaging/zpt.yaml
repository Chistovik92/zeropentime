# Конфиг узла zeropentime (установлен пакетом).
#
# Для вступления в комнату ничего писать не нужно: откройте ссылку-приглашение
# (zpt://…) или выполните от администратора:
#   zpt join "zpt://join?…"
#
# Все параметры — в руководстве: https://github.com/Chistovik92/zeropentime/blob/main/docs/GUIDE.md
# (раздел «Справочник: конфиг узла»). Примеры:
#
# listen_port: 41641
# log_level: info
# kill_switch: false
# dns: [192.168.1.53]
