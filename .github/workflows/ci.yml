name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        if: runner.os != 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}
      - run: go test -count=1 ./...
        if: runner.os == 'Windows'
        env:
          TMP: ${{ runner.temp }}
      - name: Сохранить отладочные логи e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ runner.os }}
          path: ${{ runner.temp }}/zpt-e2e-*.log
          if-no-files-found: ignore
      - run: go build -o dist/ ./cmd/zpt ./cmd/zpt-controller

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Образ контроллера собирается и работает
        run: |
          docker build -f deploy/Dockerfile --build-arg VERSION=ci -t zpt-controller:ci .
          docker run -d --name zc -p 8080:8080 zpt-controller:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          docker exec zc zpt-controller version | grep -q "zpt-controller ci"
          docker exec zc zpt-controller useradd -db /data/controller.db -login admin -admin | grep -q "пользователь создан"
          curl -fsS http://127.0.0.1:8080/login | grep -q zeropentime
          docker inspect --format '{{.State.Health.Status}}' zc
          docker rm -f zc
      - name: docker compose с Caddy (HTTPS для localhost)
        env:
          ZPT_DOMAIN: localhost
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          for i in $(seq 1 60); do curl -fsSk https://localhost/healthz && break; sleep 2; done
          curl -fsSk https://localhost/login | grep -q zeropentime
          docker compose -f deploy/docker-compose.yml exec -T controller zpt-controller useradd -db /data/controller.db -login admin -admin | grep -q "пользователь создан"
      - name: Логи при ошибке
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs || true
        env:
          ZPT_DOMAIN: localhost

  natlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y -qq nftables >/dev/null
      - run: go build -o "$RUNNER_TEMP/bin/" ./cmd/zpt ./cmd/zpt-controller
      - name: NAT-стенд (network namespaces, настоящие TUN)
        run: sudo NATLAB_TRACE=1 NATLAB_WORK="$RUNNER_TEMP/natlab" bash test/natlab/run.sh "$RUNNER_TEMP/bin"
      - name: Логи стенда
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: natlab-logs
          path: ${{ runner.temp }}/natlab-logs
          if-no-files-found: ignore

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Каждый коммит подписан (git commit -s)
        run: |
          missing=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::коммит $c без Signed-off-by (используйте git commit -s)"
              missing=1
            fi
          done
          exit $missing
