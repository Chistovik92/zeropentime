name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        if: runner.os != 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}
      - run: go test -count=1 ./...
        if: runner.os == 'Windows'
        env:
          TMP: ${{ runner.temp }}
      - name: Сохранить отладочные логи e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ runner.os }}
          path: ${{ runner.temp }}/zpt-e2e-*.log
          if-no-files-found: ignore
      - run: go build -o dist/ ./cmd/zpt ./cmd/zpt-controller

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Образ контроллера собирается и работает
        run: |
          docker build -f deploy/Dockerfile --build-arg VERSION=ci -t zpt-controller:ci .
          docker run -d --name zc -p 8080:8080 zpt-controller:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          docker exec zc zpt-controller version | grep -q "zpt-controller ci"
          docker exec zc zpt-controller useradd -db /data/controller.db -login admin -admin | grep -q "пользователь создан"
          curl -fsS http://127.0.0.1:8080/login | grep -q zeropentime
          docker inspect --format '{{.State.Health.Status}}' zc
          docker rm -f zc
      - name: docker compose с Caddy (HTTPS для localhost)
        env:
          ZPT_DOMAIN: localhost
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          for i in $(seq 1 60); do curl -fsSk https://localhost/healthz && break; sleep 2; done
          curl -fsSk https://localhost/login | grep -q zeropentime
          docker compose -f deploy/docker-compose.yml exec -T controller zpt-controller useradd -db /data/controller.db -login admin -admin | grep -q "пользователь создан"
      - name: Логи при ошибке
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs || true
        env:
          ZPT_DOMAIN: localhost

  natlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y -qq nftables >/dev/null
      - run: go build -o "$RUNNER_TEMP/bin/" ./cmd/zpt ./cmd/zpt-controller
      - name: NAT-стенд (network namespaces, настоящие TUN)
        run: sudo NATLAB_TRACE=1 NATLAB_WORK="$RUNNER_TEMP/natlab" bash test/natlab/run.sh "$RUNNER_TEMP/bin"
      - name: Логи стенда
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: natlab-logs
          path: ${{ runner.temp }}/natlab-logs
          if-no-files-found: ignore

  # Установщики ставятся на одноразовые раннеры, проверяются и удаляются.
  packages-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: deb ставится, служба работает, удаляется
        run: |
          set -x
          sudo apt-get install -y -qq desktop-file-utils rpm >/dev/null
          deb=$(ls dist/zeropentime_*_linux_amd64.deb)
          sudo apt-get install -y "./$deb"
          systemctl is-enabled zpt
          for i in $(seq 1 20); do systemctl is-active zpt && break; sleep 1; done
          systemctl is-active zpt
          zpt version
          for i in $(seq 1 20); do sudo zpt status && break; sleep 1; done
          sudo zpt status
          test "$(sudo stat -c %a /etc/zeropentime)" = 700
          desktop-file-validate /usr/share/applications/zpt-open.desktop
          grep -q "x-scheme-handler/zpt" /usr/share/applications/zpt-open.desktop
          ! echo | zpt open "zpt://nope"
          sudo apt-get remove -y zeropentime
          ! systemctl is-active zpt
          test ! -e /usr/bin/zpt
          sudo test -f /etc/zeropentime/zpt.yaml
          rpm -qpl dist/zeropentime_*_linux_amd64.rpm | grep -qx /usr/bin/zpt
          rpm -qp --scripts dist/zeropentime_*_linux_amd64.rpm | grep -q "systemctl enable zpt.service"
      - name: Журнал службы
        if: failure()
        run: sudo journalctl -u zpt --no-pager | tail -50

  packages-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/fetch-wintun.sh
      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Сборка MSI (amd64, arm64)
        shell: pwsh
        run: |
          ./scripts/build-msi.ps1 -Version 0.0.0-ci -Arch amd64 -Out dist
          ./scripts/build-msi.ps1 -Version 0.0.0-ci -Arch arm64 -Out dist
      - name: MSI ставится, служба работает, удаляется
        shell: pwsh
        run: |
          $msi = (Resolve-Path dist\zpt_0.0.0-ci_windows_amd64.msi).Path
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install: $($p.ExitCode)" }
          $s = Get-Service zeropentime
          if ($s.Status -ne "Running") { throw "служба: $($s.Status)" }
          $exe = "C:\Program Files\zeropentime\zpt.exe"
          & $exe version
          for ($i = 0; $i -lt 20; $i++) { & $exe status; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 1 }
          if ($LASTEXITCODE -ne 0) { throw "zpt status" }
          if (-not (Test-Path "C:\Program Files\zeropentime\wintun.dll")) { throw "нет wintun.dll" }
          if (-not (Test-Path "C:\ProgramData\zeropentime\zpt.yaml")) { throw "нет конфига" }
          $cmd = (Get-ItemProperty "HKLM:\Software\Classes\zpt\shell\open\command").'(default)'
          if ($cmd -notlike '*zpt.exe" open "%1"') { throw "обработчик ссылок: $cmd" }
          if ([Environment]::GetEnvironmentVariable("PATH", "Machine") -notlike "*zeropentime*") { throw "нет в PATH" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; throw "uninstall: $($p.ExitCode)" }
          if (Get-Service zeropentime -ErrorAction SilentlyContinue) { throw "служба осталась" }
          if (Test-Path $exe) { throw "zpt.exe остался" }
          if (-not (Test-Path "C:\ProgramData\zeropentime\zpt.yaml")) { throw "конфиг удалён" }
      - name: Журналы установки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: "*.log"
          if-no-files-found: ignore

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Каждый коммит подписан (git commit -s)
        run: |
          missing=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::коммит $c без Signed-off-by (используйте git commit -s)"
              missing=1
            fi
          done
          exit $missing
