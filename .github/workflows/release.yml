name: release

# Релиз на каждую версию x.y.z: git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Тесты
        run: go test -count=1 ./...
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Сохранить отладочные логи e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ runner.os }}
          path: ${{ runner.temp }}/zpt-e2e-*.log
          if-no-files-found: ignore
      - name: Заметки к релизу из CHANGELOG.md
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
